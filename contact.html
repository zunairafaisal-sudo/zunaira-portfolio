<!DOCTYPE html>
<html>


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zunaira Faisal's Portfolio - Contact</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css" media="screen and (max-width: 600px)">
    <link rel="stylesheet" href="tablet.css" media="screen and (min-width: 601px) and (max-width: 1024px)">
    <link rel="stylesheet" href="laptop.css" media="screen and (min-width: 1025px)">
</head>


<body>
    <header>
        <h1>My Personal Portfolio</h1>
        <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact Me</a>
        </nav>
    </header>


    <main>
        <section>
            <h2>Contact Me</h2>

            <p>
                If you would like to get in touch with me, please
                fill out the form below.
            </p>


            <form>
                <label for="name">Name:</label>
                <br>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your name"
                       required>
                <br><br>


                <label for="email">Email:</label>
                <br>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email ID"
                       required>
                <br><br>


                <label for="phone">Cell Phone:</label>
                <br>
                <input type="tel"
                       id="phone"
                       name="phone"
                       placeholder="Enter your phone #"
                       required>
                <br><br>


                <label for="comments">Comments:</label>
                <br>
                <textarea id="comments"
                          name="comments"
                          rows="5"
                          cols="30"
                          placeholder="Enter your comments"
                          required></textarea>
                <br><br>

                <input type="reset" id="reset" value="Reset">
                <input type="submit" id="submit" value="Submit">
                


            </form>
        </section>
    </main>


    <footer>

        <p>Email: zunaira.faisal@ontariotechu.net</p>
        <p>© 2026 Zunaira Faisal. All Rights Reserved.</p>
    </footer>

</body>
</html>
